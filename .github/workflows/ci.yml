name: CI

# Verification CI: runs the backend test suite touched by the convective-setup
# work and builds the frontend. Safe to run on demand; no deploys or package
# publishing happen here.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Ensure runtime hazard models
        run: python -m backend.ml.ensure_runtime_models

      - name: Run merged-outlook and deployable-pipeline tests
        run: |
          python -m pytest -q \
            backend/tests/test_merged_outlook.py \
            backend/tests/test_deployable_outlook_pipeline.py

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
