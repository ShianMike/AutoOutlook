name: Publish Google Cloud artifacts to Cloudflare

on:
  schedule:
    # Poll for a completed GCS snapshot every 15 minutes. The gate below skips
    # all expensive deploy work when production already has the latest complete
    # cycle, giving the publisher multiple recovery chances if an individual
    # GitHub scheduled run is delayed or skipped.
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Deploy even when production already reports the same cycle.'
        required: false
        default: 'false'

concurrency:
  group: autooutlook-cloudflare-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AUTOOUTLOOK_PRODUCTION_INDEX_URL: ${{ vars.AUTOOUTLOOK_PRODUCTION_INDEX_URL || 'https://autooutlook.tech/api/outlook/incremental' }}
  GCP_ARTIFACT_BUCKET: ${{ vars.GCP_ARTIFACT_BUCKET }}
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'autooutlook-pages' }}
  CLOUDFLARE_PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH || 'master' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Download and validate completed GCS index
        id: gate
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy || 'false' }}
        run: |
          mkdir -p .autooutlook/state
          gcloud storage cp \
            "gs://${GCP_ARTIFACT_BUCKET}/latest_incremental_complete/index.json" \
            .autooutlook/state/gcs-index.json
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          index = json.loads(Path(".autooutlook/state/gcs-index.json").read_text(encoding="utf-8"))
          ready = index.get("readyForecastHours") or []
          ready_count = len(ready) if isinstance(ready, list) else 0
          spc = index.get("spcVerification") or {}
          has_fresh_spc = bool(spc.get("spcFetchedAtISO")) and bool(
              spc.get("spcFetchedAfterPredictionArtifacts")
          )
          if index.get("status") != "complete" or ready_count < 49 or not has_fresh_spc:
              raise SystemExit(
                  "Refusing publish: GCS snapshot is incomplete "
                  f"(status={index.get('status')!r}, ready={ready_count}, spc={has_fresh_spc})."
              )

          expected = index.get("cycleTimeISO", "")
          force = os.environ.get("FORCE_DEPLOY", "false").lower() == "true"
          should_publish = True
          reason = "manual force requested" if force else "production needs the completed GCS cycle"

          if not force:
              try:
                  request = urllib.request.Request(
                      os.environ["AUTOOUTLOOK_PRODUCTION_INDEX_URL"],
                      headers={"User-Agent": "AutoOutlook-GCS-Publisher/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      production = json.load(response)
                  production_ready = production.get("readyForecastHours") or []
                  production_spc = production.get("spcVerification") or {}
                  production_complete = (
                      production.get("cycleTimeISO") == expected
                      and production.get("status") == "complete"
                      and isinstance(production_ready, list)
                      and len(production_ready) >= 49
                      and bool(production_spc.get("spcFetchedAtISO"))
                      and bool(production_spc.get("spcFetchedAfterPredictionArtifacts"))
                  )
                  if production_complete:
                      should_publish = False
                      reason = "production already has this complete GCS cycle"
              except Exception as exc:
                  reason = f"production freshness check failed: {exc}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"should_publish={str(should_publish).lower()}", file=output)
              print(f"cycle_time_iso={expected}", file=output)
          print(reason)
          print(
              f"GCS snapshot: cycle={expected} status={index.get('status')} "
              f"ready={ready_count} spc={has_fresh_spc}"
          )
          PY

      - name: Set up Python
        if: steps.gate.outputs.should_publish == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node
        if: steps.gate.outputs.should_publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r backend/requirements.txt
          npm ci

      - name: Hydrate generated artifacts from GCS
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          mkdir -p backend/artifacts
          # The live production pipeline keeps rotating objects in the bucket
          # while we hydrate, so a recursive rsync can list an object that is
          # deleted before it gets copied and abort with GcsNotFoundError.
          # Each rsync invocation re-enumerates the bucket and skips already
          # copied files, so retrying converges once the transient race clears.
          # The downstream "Verify static API export" step is the real gate on
          # completeness, so tolerating these transient misses here is safe.
          attempts=5
          for attempt in $(seq 1 "${attempts}"); do
            if gcloud storage rsync --recursive \
                "gs://${GCP_ARTIFACT_BUCKET}" \
                backend/artifacts; then
              echo "Hydrated artifacts from GCS on attempt ${attempt}."
              exit 0
            fi
            echo "Hydrate attempt ${attempt}/${attempts} failed (likely a transient race with the live pipeline); retrying in 15s..."
            sleep 15
          done
          echo "Hydrate failed after ${attempts} attempts." >&2
          exit 1

      - name: Build frontend and export static API
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          python -m backend.ml.ensure_runtime_models
          npm run build
          python scripts/export-static-api.py

      - name: Verify static API export
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(
              Path(".autooutlook/state/gcs-index.json").read_text(encoding="utf-8")
          ).get("cycleTimeISO")
          deployed = json.loads(
              Path("dist/_api/outlook/incremental/index.json").read_text(encoding="utf-8")
          )
          ready = deployed.get("readyForecastHours") or []
          if (
              deployed.get("cycleTimeISO") != expected
              or deployed.get("status") != "complete"
              or not isinstance(ready, list)
              or len(ready) < 49
          ):
              raise SystemExit(
                  "Static export does not match the completed GCS snapshot: "
                  f"expected={expected!r}, cycle={deployed.get('cycleTimeISO')!r}, "
                  f"status={deployed.get('status')!r}, ready={len(ready) if isinstance(ready, list) else 0}"
              )
          print(f"Static export verified: cycle={expected} ready={len(ready)}")
          PY

      - name: Persist ENH+ archive updates to GCS
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          if [ -d backend/artifacts/enh_plus_archive ]; then
            gcloud storage rsync --recursive \
              backend/artifacts/enh_plus_archive \
              "gs://${GCP_ARTIFACT_BUCKET}/enh_plus_archive"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.should_publish == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$CLOUDFLARE_PAGES_BRANCH" \
            --commit-dirty=true

      - name: Confirm deployed cycle
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          expected = "${{ steps.gate.outputs.cycle_time_iso }}"
          url = os.environ["AUTOOUTLOOK_PRODUCTION_INDEX_URL"]
          last_payload = None
          for attempt in range(18):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "AutoOutlook-GCS-Publisher/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except Exception as exc:
                  last_payload = {"error": f"{type(exc).__name__}: {exc}"}
                  print(f"waiting for deployment attempt {attempt + 1}: {last_payload['error']}")
                  time.sleep(10)
                  continue

              last_payload = payload
              ready = payload.get("readyForecastHours") or []
              spc = payload.get("spcVerification") or {}
              if (
                  payload.get("cycleTimeISO") == expected
                  and payload.get("status") == "complete"
                  and isinstance(ready, list)
                  and len(ready) >= 49
                  and bool(spc.get("spcFetchedAtISO"))
                  and bool(spc.get("spcFetchedAfterPredictionArtifacts"))
              ):
                  print(f"Confirmed production cycle {expected} with {len(ready)} hours.")
                  raise SystemExit
              print(
                  f"waiting for deployment attempt {attempt + 1}: "
                  f"cycle={payload.get('cycleTimeISO')!r} status={payload.get('status')!r} "
                  f"ready={len(ready) if isinstance(ready, list) else 0}"
              )
              time.sleep(10)
          raise SystemExit(f"Deployed cycle was not confirmed: {last_payload!r}")
          PY
