substitutions:
  _REGION: us-east1
  _SERVICE: autooutlook
  _REPOSITORY: autooutlook
  _ARTIFACT_BUCKET: autooutlook-artifacts-project-e75d6e93-197d-4d41-ad6
  _RUNTIME_SERVICE_ACCOUNT: autooutlook-runtime@project-e75d6e93-197d-4d41-ad6.iam.gserviceaccount.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --service-account
      - ${_RUNTIME_SERVICE_ACCOUNT}
      - --memory
      - 2Gi
      - --cpu
      - "2"
      - --timeout
      - "120"
      - --concurrency
      - "20"
      - --min-instances
      - "0"
      - --max-instances
      - "1"
      - --cpu-boost
      - --set-env-vars
      - AUTOOUTLOOK_CORS_ORIGINS=*,AUTOOUTLOOK_FORECAST_SOURCE=artifact,AUTOOUTLOOK_ENABLE_LIVE_BUILD=false,AUTOOUTLOOK_ARTIFACT_BUCKET=${_ARTIFACT_BUCKET},WEB_CONCURRENCY=1,WEB_THREADS=20,GUNICORN_TIMEOUT=120

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
